const icons={dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',pcas:'M4 5h16v16H4z M8 3v4 M16 3v4 M4 10h16',monitor:'M4 4h16v16H4z M4 9h16 M9 9v11',changes:'M4 7h15l-4-4 M20 17H5l4 4',reports:'M6 3h9l4 4v14H6z M14 3v5h5 M9 12h7 M9 16h7',io:'M12 3v12l-4-4 M12 15l4-4 M4 16v5h16v-5'};const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${(icons[k]||icons.dashboard).split(' M').map((d,i)=>`<path d="${i?'M':''}${d}"/>`).join('')}</svg>`;
const tabs=[['dashboard','Dashboard executivo'],['pcas','Gestão dos PCAs'],['monitor','Monitoramento'],['changes','Alterações do PCA'],['reports','Relatórios e notas técnicas'],['io','Importação e exportação']];
function seed(){const p={id:uid(),year:2027,unit:'AGU • Unidade demonstrativa',owner:'Operador demonstrativo',status:'Em monitoramento',created:now(),demo:true};const make=(n,name,value,priority)=>({id:uid(),pca:p.id,number:n+'/2027',name,description:name,unit:p.unit,original:value,current:value,annual:'',start:'2027-01-01',desired:'2027-01-01',priority,status:'Planejada',justification:'Exemplo fictício para conhecer o painel.',created:now(),updated:now(),demo:true,added:false});const c=[make('01','Locação de veículos com motorista',998837.76,'Alta'),make('02','Aquisição de equipamentos de informática',180000,'Média'),make('03','Serviços de manutenção predial',245000,'Alta')];const r={id:uid(),pca:p.id,created:now(),owner:p.owner,general:'Solicitação fictícia para demonstração do fluxo.',status:'Rascunho',demo:true,items:[{id:uid(),type:'value',contract:c[0].id,before:c[0].current,after:1050000,date:today(),justification:'Atualização demonstrativa da estimativa.'},{id:uid(),type:'exclude',contract:c[1].id,before:c[1].current,after:0,date:today(),justification:'Necessidade reavaliada neste exemplo fictício.'},{id:uid(),type:'include',before:0,after:32000,date:today(),justification:'Nova necessidade demonstrativa.',data:make('04','Aquisição de mobiliário — exemplo de inclusão',32000,'Baixa')}]};return{version:1,pcas:[p],contracts:c,requests:[r],history:[],active:p.id};}
let db,loadError='';try{db=JSON.parse(localStorage.getItem(KEY)||'null');if(db)validateDB(db);else {db=seed();localStorage.setItem(KEY,JSON.stringify(db))}}catch(e){loadError='Não foi possível ler os dados salvos. Nenhum dado foi sobrescrito. Restaure um backup ou exporte o armazenamento bruto antes de continuar.';db={version:1,pcas:[],contracts:[],requests:[],history:[],active:''};}
let page='dashboard',filters={q:'',priority:'',status:'',sort:'',kind:''},selected=new Set(),pageNum=1,reportId='',draftId='',importRows=[],importHeaders=[],importCandidates=[];
function persist(){if(loadError)throw Error('Armazenamento bloqueado: restaure um backup antes de salvar.');try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){throw Error('Não foi possível salvar no navegador. Exporte um backup e verifique o espaço e as permissões.')}}
function commit(mutator){const old=JSON.stringify(db);try{mutator();persist();render();return true}catch(e){db=JSON.parse(old);toast(e.message,true);return false}}
function toast(t,error=false){$('#toast').innerHTML=`<div class="toast" style="${error?'background:#9e3547':''}">${esc(t)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').innerHTML='',5000)}
function pca(){return db.pcas.find(p=>p.id===db.active)}function contracts(){return db.contracts.filter(c=>c.pca===db.active)}function requests(){return db.requests.filter(r=>r.pca===db.active)}function hist(){return db.history.filter(h=>h.pca===db.active)}function active(c){return c.status!=='Excluída do PCA'}function total(cs=contracts()){return round(sum(cs.filter(active).map(c=>c.current)))}function baseline(cs=contracts()){return round(sum(cs.filter(c=>!c.added).map(c=>c.original)))}
function setPca(id){db.active=id;selected.clear();filters={q:'',priority:'',status:'',sort:'',kind:''};pageNum=1;try{persist()}catch(e){toast(e.message,true)}render()}
function go(p){page=p;selected.clear();pageNum=1;document.body.classList.remove('menu');render()}
function heading(title,sub,actions=''){return `<div class="heading"><div><div class="eyebrow">AGU / ${esc(pca()?.year||'Planejamento')}</div><h1>${title}</h1><p class="lead">${sub}</p></div><div class="actions">${actions}</div></div>`}
function badge(s){return `<span class="badge ${/Exclu|cancel/i.test(s)?'red':/Final|Alta|Conclu/i.test(s)?'green':/Rasc|Média/i.test(s)?'orange':'neutral'}">${esc(s)}</span>`}
function render(){ $('#nav').innerHTML=tabs.map(([k,n])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${icon(k)}${n}</button>`).join('');$('#activePca').innerHTML=db.pcas.length?db.pcas.map(p=>`<option value="${p.id}" ${p.id===db.active?'selected':''}>PCA ${p.year} · ${esc(p.unit)}</option>`).join(''):'<option>Nenhum PCA cadastrado</option>';let banner=loadError?`<div class="error">${loadError}<button onclick="rawBackup()">Exportar armazenamento bruto</button></div>`:pca()?.demo?`<div class="notice noprint"><span><strong>Ambiente demonstrativo.</strong> As contratações e a solicitação deste PCA são fictícias.</span><button onclick="removeDemo()">Remover dados demonstrativos</button></div>`:'';$('#app').innerHTML=banner+({dashboard:dashboard,pcas:pcasView,monitor:monitor,changes:changes,reports:reports,io:io}[page])();}
function dashboard(){const cs=contracts(),hs=hist(),stats=[['Contratações ativas',cs.filter(active).length,'Registros previstos no PCA','monitor',''],['Valor total do PCA',money(total()),'Estimativa atual das contratações ativas','monitor',''],['Impacto financeiro',money(total()-baseline()),'Em relação à previsão original','changes',''],['Inclusões registradas',hs.filter(h=>h.type==='include').length,'Contratações incluídas após o planejamento','monitor','include'],['Exclusões registradas',hs.filter(h=>h.type==='exclude').length,'Histórico preservado para consulta','monitor','exclude'],['Alterações de valor',hs.filter(h=>h.type==='value').length,'Atualizações financeiras efetivadas','monitor','value']];return heading('Dashboard executivo','Uma visão clara do planejamento e das mudanças do PCA.',`<button onclick="go('io')">Importar planilha</button><button class="primary" onclick="startRequest()">+ Registrar alteração</button>`)+`<div class="cards">${stats.map(([l,v,s,p,k])=>`<button class="card" onclick="drill('${p}','${k}')"><div class="label">${l}</div><span class="iconbox">${icon(p==='monitor'?'monitor':'changes')}</span><div class="metric">${v}</div><small>${s} ↗</small></button>`).join('')}</div><div class="grid2"><section class="panel"><div class="panel-head"><div><h2>Distribuição por prioridade</h2><small>Contratações ativas no exercício</small></div>${badge('PCA '+(pca()?.year||'—'))}</div>${['Alta','Média','Baixa'].map((l,i)=>bar(l,cs.filter(c=>active(c)&&c.priority===l).length,cs.filter(active).length,['#6056d6','#efa944','#37a68c'][i])).join('')}</section><section class="panel"><div class="panel-head"><div><h2>Alterações efetivadas</h2><small>Distribuição por tipo</small></div></div>${['include','exclude','value'].map((t,i)=>bar(typeName(t),hs.filter(h=>h.type===t).length,hs.length,['#37a68c','#de7984','#6056d6'][i])).join('')}</section></div><section class="panel"><div class="panel-head"><div><h2>Solicitações recentes</h2><small>Acompanhe o andamento das alterações</small></div><button onclick="go('changes')">Ver todas ↗</button></div>${requests().length?requests().slice(-3).reverse().map(requestCard).join(''):'<div class="empty">Nenhuma solicitação registrada. Comece cadastrando ou importando suas contratações.</div>'}</section>`}
function bar(l,n,d,c){return `<div class="bar-row"><span>${l}</span><div class="track"><div class="fill" style="width:${d?n/d*100:0}%;background:${c}"></div></div><strong>${n}</strong></div>`}function drill(p,k){page=p;filters.kind=k;filters.status=k?'':'Ativas';render()}
function pcasView(){return heading('Gestão dos PCAs','Organize os planos por exercício e unidade responsável.',`<button class="primary" onclick="pcaForm()">+ Cadastrar PCA</button>`)+db.pcas.map(p=>`<section class="panel"><div class="split"><div><div class="eyebrow">EXERCÍCIO ${p.year}</div><h1>PCA ${p.year}</h1><p>${esc(p.unit)}</p><p class="hint">Responsável: ${esc(p.owner)}<br>Cadastro: ${dt(p.created)} ${p.demo?' · Dados demonstrativos':''}</p></div>${badge(p.status)}</div><div class="actions"><strong>${db.contracts.filter(c=>c.pca===p.id&&active(c)).length} ativas · ${money(total(db.contracts.filter(c=>c.pca===p.id)))}</strong><button onclick="setPca('${p.id}');go('monitor')">Abrir contratações</button><button onclick="pcaForm('${p.id}')">Editar PCA</button></div></section>`).join('')}
function field(name,label,value='',type='text',required=false,full=false){return `<div class="field ${full?'full':''}"><label for="f_${name}">${label}${required?' *':''}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''}></div>`}function area(name,label,value='',required=false){return `<div class="field full"><label for="f_${name}">${label}${required?' *':''}</label><textarea id="f_${name}" name="${name}" ${required?'required':''}>${esc(value)}</textarea></div>`}function sel(name,label,opts,value){return `<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${opts.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
let modalPrev=null,modalActionSerial=0;
function modal(title,html,submit,label='Salvar'){
 modalPrev=document.activeElement;const serial=++modalActionSerial;
 $('#modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button type="button" onclick="closeModal()" aria-label="Fechar">✕</button></div><form id="modalForm" novalidate>${html}<div id="formError" role="alert" aria-live="assertive"></div><footer><button type="button" onclick="closeModal()">Fechar</button>${submit?`<button type="button" id="modalAction" class="primary">${esc(label)}</button>`:''}</footer></form></section></div>`;
 const form=$('#modalForm'),action=$('#modalAction'),errorBox=$('#formError');let busy=false;
 const execute=async event=>{
  event?.preventDefault();event?.stopPropagation();if(!submit||busy||serial!==modalActionSerial)return;
  errorBox.innerHTML='';
  const invalid=Array.from(form.elements).filter(el=>el.willValidate&&!el.validity.valid);
  if(invalid.length){errorBox.innerHTML=`<div class="error">Preencha os campos obrigatórios antes de continuar: ${invalid.map(el=>esc(el.labels?.[0]?.textContent||el.name||'campo obrigatório')).join(', ')}.</div>`;invalid[0].focus();errorBox.scrollIntoView({block:'nearest'});return}
  const values={};for(const el of Array.from(form.elements)){if(!el.name||el.disabled||['button','submit','reset','file'].includes(el.type))continue;if(['checkbox','radio'].includes(el.type)&&!el.checked)continue;values[el.name]=el.value}
  busy=true;if(action){action.disabled=true;action.textContent=/valid|mapea/i.test(label)?'Validando registros…':'Processando…';action.setAttribute('aria-busy','true')}
  try{await new Promise(resolve=>setTimeout(resolve,0));if(serial!==modalActionSerial)return;await submit(values)}
  catch(error){if(serial===modalActionSerial&&errorBox.isConnected){errorBox.innerHTML=`<div class="error">${esc(error.message||'Não foi possível concluir a operação.')}</div>`;errorBox.scrollIntoView({block:'nearest'})}else toast(error.message||'Falha na operação.',true)}
  finally{busy=false;if(action?.isConnected){action.disabled=false;action.textContent=label;action.removeAttribute('aria-busy')}}
 };
 action?.addEventListener('click',execute);form.addEventListener('submit',execute);
 $('#modalRoot').querySelector('input,select,textarea,button')?.focus();
}

function closeModal(){$('#modalRoot').innerHTML='';modalPrev?.focus()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('#modalForm')){const nodes=[...$('#modalRoot').querySelectorAll('button,input,select,textarea,[tabindex]')].filter(x=>!x.disabled);const a=nodes[0],b=nodes.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}});
function pcaForm(id){const p=db.pcas.find(p=>p.id===id)||{};modal(id?'Editar PCA':'Cadastrar PCA',`<div class="formgrid">${field('year','Ano de referência',p.year||2027,'number',true)}${sel('status','Situação',['Em planejamento','Em monitoramento','Encerrado'],p.status)}${field('unit','Unidade responsável',p.unit||'','text',true,true)}${field('owner','Responsável pelo monitoramento',p.owner||'','text',true,true)}</div>`,v=>{if(!Number.isInteger(+v.year)||+v.year<2000||+v.year>2200)throw Error('Informe um exercício válido.');if(!v.unit.trim()||!v.owner.trim())throw Error('Preencha unidade e responsável.');if(db.pcas.some(x=>x.id!==id&&x.year===+v.year&&x.unit.toLowerCase()===v.unit.trim().toLowerCase()))throw Error('Este PCA já está cadastrado para a unidade.');if(commit(()=>{const obj={...p,...v,year:+v.year,id:id||uid(),created:p.created||now()};id?Object.assign(p,obj):db.pcas.push(obj);db.active=obj.id})){closeModal();toast('PCA salvo.')}})}
function contractFields(c={}){return `<div class="formgrid">${field('number','Número da contratação',c.number||'','text',true)}${field('name','Nome da futura contratação',c.name||'','text',true)}${area('description','Descrição do objeto',c.description||'',true)}${field('unit','Unidade demandante',c.unit||pca()?.unit||'','text',true)}${field('current','Valor estimado (R$)',c.current??'','number',true)}${field('annual','Valores por exercício (ex.: 2027: 10000; 2028: 5000)',c.annual||'','text',false,true)}${field('start','Vigência inicial prevista',c.start||'','date')}${field('desired','Data desejada',c.desired||'','date')}${sel('priority','Prioridade',['Alta','Média','Baixa'],c.priority||'Média')}${sel('status','Situação',['Planejada','Em andamento','Concluída','Suspensa'],c.status||'Planejada')}${area('justification','Justificativa',c.justification||'',true)}</div>`}
function readContract(v,existing){const val=Number(v.current);if(!v.number?.trim()||!v.name?.trim()||!v.description?.trim()||!v.unit?.trim()||!v.justification?.trim())throw Error('Preencha os campos obrigatórios e a justificativa.');if(!Number.isFinite(val)||val<0||!String(v.current).trim())throw Error('Informe um valor válido, igual ou maior que zero.');if(db.contracts.some(c=>c.pca===db.active&&c.number.toLowerCase()===v.number.trim().toLowerCase()&&c.id!==existing?.id))throw Error('O número já está cadastrado neste PCA.');return {...v,number:v.number.trim(),name:v.name.trim(),current:round(val),pca:db.active}}
function contractForm(id){if(!pca())return toast('Cadastre um PCA primeiro.',true);const c=db.contracts.find(c=>c.id===id);if(c&&!active(c))return toast('A contratação excluída está disponível apenas para consulta.',true);modal(c?'Editar contratação':'Cadastrar previsão original',`<p class="hint">${c?'Alterações financeiras devem ser registradas em uma solicitação.':'Use este cadastro para a previsão original. Para itens não previstos, registre uma inclusão no módulo Alterações.'}</p>${contractFields(c)}`,v=>{const data=readContract(v,c);if(c&&(data.current!==c.current||data.annual!==c.annual))throw Error('Para alterar valores, utilize Registrar alteração do PCA.');if(commit(()=>{if(c){const before=JSON.parse(JSON.stringify(c));Object.assign(c,data,{updated:now()});db.history.push({id:uid(),pca:c.pca,contract:c.id,type:'edit',at:now(),operator:pca().owner,before:c.current,after:c.current,justification:data.justification,request:'Cadastro',snapshot:before,updatedSnapshot:JSON.parse(JSON.stringify(c)),demo:!!c.demo})}else db.contracts.push({...data,id:uid(),original:data.current,created:now(),updated:now(),added:false,demo:false})})){closeModal();toast('Contratação salva.')}});if(c){$('#f_current').readOnly=true;$('#f_annual').readOnly=true}}
function filtered(){return contracts().filter(c=>(!filters.q||(c.number+' '+c.name).toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.priority||c.priority===filters.priority)&&(!filters.status||(filters.status==='Ativas'?active(c):c.status===filters.status))&&(!filters.kind||hist().some(h=>h.contract===c.id&&h.type===filters.kind))).sort((a,b)=>filters.sort==='asc'?a.current-b.current:filters.sort==='desc'?b.current-a.current:a.number.localeCompare(b.number,'pt-BR',{numeric:true}))}
function filter(k,v){filters[k]=v;pageNum=1;render();if(k==='q'){const el=$('#search');el.focus();el.setSelectionRange(v.length,v.length)}}
function monitor(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/10));pageNum=Math.min(pageNum,pages);const visible=rows.slice((pageNum-1)*10,pageNum*10);return heading('Monitoramento das contratações','Consulte a previsão, acompanhe valores e selecione os itens para alteração.',`<button onclick="go('io')">Importar Excel / CSV</button><button class="primary" onclick="contractForm()">+ Cadastrar contratação</button>`)+`<section class="panel"><div class="panel-head"><div><h2>Contratações do PCA ${pca()?.year||'—'}</h2><small>${rows.length} registros encontrados ${filters.kind?' · Filtro: '+typeName(filters.kind):''}</small></div><button onclick="filters={q:'',priority:'',status:'',sort:'',kind:''};render()">Limpar filtros</button></div><div class="filters"><input id="search" placeholder="Pesquisar número ou objeto…" aria-label="Pesquisar contratação" value="${esc(filters.q)}" oninput="filter('q',this.value)"><select aria-label="Prioridade" onchange="filter('priority',this.value)"><option value="">Todas as prioridades</option>${['Alta','Média','Baixa'].map(s=>`<option ${filters.priority===s?'selected':''}>${s}</option>`).join('')}</select><select aria-label="Situação" onchange="filter('status',this.value)"><option value="">Todas as situações</option>${['Ativas','Planejada','Em andamento','Concluída','Suspensa','Excluída do PCA'].map(s=>`<option ${filters.status===s?'selected':''}>${s}</option>`).join('')}</select><select aria-label="Ordenação" onchange="filter('sort',this.value)"><option value="">Ordenar por número</option><option value="asc" ${filters.sort==='asc'?'selected':''}>Menor valor</option><option value="desc" ${filters.sort==='desc'?'selected':''}>Maior valor</option></select></div><div class="actions" style="margin-bottom:15px"><small>${selected.size} selecionadas</small><button ${!selected.size?'disabled':''} onclick="startRequest([...selected])">Registrar alterações nas selecionadas</button><button onclick="exportContracts()">Exportar CSV</button></div><div class="tablewrap"><table><thead><tr><th><input aria-label="Selecionar página" type="checkbox" ${visible.filter(active).length&&visible.filter(active).every(c=>selected.has(c.id))?'checked':''} onchange="selectPage(this.checked)"></th><th>Número</th><th>Objeto / unidade</th><th>PCA</th><th>Valor atualizado</th><th>Prioridade</th><th>Situação</th><th>Alterações</th><th>Ações</th></tr></thead><tbody>${visible.map(c=>`<tr><td><input aria-label="Selecionar ${esc(c.number)}" type="checkbox" ${selected.has(c.id)?'checked':''} ${!active(c)?'disabled':''} onchange="toggleSelect('${c.id}',this.checked)"></td><td>${esc(c.number)}</td><td><strong>${esc(c.name)}</strong><small>${esc(c.unit)}${c.demo?' · Demonstração':''}${c.added?' · Inclusão posterior':''}</small></td><td>${pca()?.year}</td><td class="money">${money(c.current)}</td><td>${badge(c.priority)}</td><td>${badge(c.status)}</td><td>${db.history.filter(h=>h.contract===c.id).length}</td><td><div class="actions"><button onclick="detail('${c.id}')">Ver</button>${active(c)?`<button onclick="contractForm('${c.id}')">Editar</button>`:''}</div></td></tr>`).join('')}</tbody></table>${!rows.length?'<div class="empty">Nenhuma contratação encontrada.</div>':''}</div><div class="pagination"><span>Página ${pageNum} de ${pages} · ${rows.length} registros</span><div class="actions"><button ${pageNum===1?'disabled':''} onclick="pageNum--;render()">Anterior</button><button ${pageNum===pages?'disabled':''} onclick="pageNum++;render()">Próxima</button></div></div></section>`}
function toggleSelect(id,on){on?selected.add(id):selected.delete(id);render()}function selectPage(on){filtered().slice((pageNum-1)*10,pageNum*10).filter(active).forEach(c=>on?selected.add(c.id):selected.delete(c.id));render()}
function detail(id){const c=db.contracts.find(c=>c.id===id);const pairs=[['Número',c.number],['Nome',c.name],['Objeto',c.description],['Unidade',c.unit],['Original',money(c.original)],['Atualizado',money(c.current)],['Diferença',money(c.current-c.original)],['Variação',c.original?((c.current-c.original)/c.original*100).toFixed(2)+'%':'Não aplicável'],['Por exercício',c.annual||'—'],['Vigência inicial',dt(c.start)],['Data desejada',dt(c.desired)],['Situação',c.status],['Prioridade',c.priority],['Justificativa',c.justification],['Criado em',dt(c.created)],['Atualizado em',dt(c.updated)]];modal('Detalhes da contratação',`<div class="detailgrid">${pairs.map(([l,v])=>`<div><small>${l}</small><strong>${esc(v)}</strong></div>`).join('')}</div>${c.sourceFields?`<h3>Dados originais da planilha — ${esc(c.sourceSheet)}</h3><p class="hint">Linha ${c.sourceRow} · Situação: ${esc(c.sourceStatus)} · Prioridade: ${esc(c.sourcePriority)}</p><div class="tablewrap"><table><tbody>${c.sourceFields.map(f=>`<tr><th>${esc(f.header)}</th><td>${esc(f.value)}</td></tr>`).join('')}</tbody></table></div>`:''}<h3>Histórico e rastreabilidade</h3>${db.history.filter(h=>h.contract===id).slice().reverse().map(h=>`<div class="history"><strong>${esc(typeName(h.type))} · ${dt(h.at)}</strong><p>${esc(h.operator)} · ${esc(h.request.slice(0,8))}<br>${money(h.before)} → ${money(h.after)}</p><p>${esc(h.justification)}</p>${h.type==='edit'?`<details><summary>Campos modificados</summary>${Object.keys(h.updatedSnapshot||{}).filter(k=>!['updated'].includes(k)&&JSON.stringify(h.snapshot?.[k])!==JSON.stringify(h.updatedSnapshot[k])).map(k=>`<p>${esc(k)}: ${esc(h.snapshot?.[k])} → ${esc(h.updatedSnapshot[k])}</p>`).join('')}</details>`:''}</div>`).join('')||'<p class="hint">Sem alterações registradas.</p>'}`,null)}
function typeName(t){return {include:'Inclusão',exclude:'Exclusão',value:'Alteração de valor',edit:'Edição cadastral'}[t]||t}
function requestCard(r){return `<div class="request"><div><strong>Solicitação #${esc(r.id.slice(0,8).toUpperCase())}</strong> ${badge(r.status)}<p>${dt(r.created)} · ${esc(r.owner)} · ${r.items.length} alterações${r.demo?' · Demonstrativa':''}</p></div><div class="actions"><button onclick="${r.status==='Rascunho'?`editRequest('${r.id}')`:`showReport('${r.id}')`}">${r.status==='Rascunho'?'Editar solicitação':'Ver relatório'}</button>${r.status==='Rascunho'?`<button class="danger" onclick="cancelRequest('${r.id}')">Cancelar</button>`:''}</div></div>`}
function changes(){return heading('Alterações do PCA','Agrupe inclusões, exclusões e alterações de valor em uma solicitação.',`<button class="primary" onclick="startRequest()">+ Registrar alteração do PCA</button>`)+`<section class="panel"><div class="panel-head"><div><h2>Solicitações de alteração</h2><small>Rascunhos não alteram os indicadores até a finalização.</small></div>${badge(requests().length+' solicitações')}</div>${requests().slice().reverse().map(requestCard).join('')||'<div class="empty">Nenhuma solicitação cadastrada.</div>'}</section><section class="panel"><h2>Histórico consolidado</h2><p class="hint">A identificação do operador é informativa. Este armazenamento local não equivale a autenticação ou auditoria inviolável.</p><div class="tablewrap"><table><thead><tr><th>Data e hora</th><th>Contratação</th><th>Tipo</th><th>Anterior</th><th>Novo</th><th>Operador / justificativa</th></tr></thead><tbody>${hist().slice().reverse().map(h=>`<tr><td>${new Date(h.at).toLocaleString('pt-BR')}</td><td>${esc(db.contracts.find(c=>c.id===h.contract)?.number||h.contract)}</td><td>${badge(typeName(h.type))}</td><td>${money(h.before)}</td><td>${money(h.after)}</td><td>${esc(h.operator)}<small>${esc(h.justification)}</small></td></tr>`).join('')}</tbody></table></div></section>`}
function startRequest(ids=[]){if(!pca())return toast('Cadastre um PCA primeiro.',true);modal('Nova solicitação de alteração',`<p class="hint">${ids.length?'As contratações selecionadas serão adicionadas como alterações de valor. Você poderá ajustar o tipo e os valores antes de finalizar.':'Você poderá adicionar várias alterações no próximo passo.'}</p><div class="formgrid">${field('owner','Responsável',pca().owner,'text',true,true)}${area('general','Justificativa geral (opcional)')}</div>`,v=>{if(!v.owner.trim())throw Error('Informe o responsável.');const r={id:uid(),pca:db.active,created:now(),owner:v.owner.trim(),general:v.general,status:'Rascunho',demo:false,items:ids.map(id=>{const c=db.contracts.find(c=>c.id===id);return{id:uid(),type:'value',contract:id,before:c.current,after:c.current,date:today(),justification:''}})};if(commit(()=>db.requests.push(r))){closeModal();editRequest(r.id)}},'Criar rascunho')}
function editRequest(id){const r=db.requests.find(r=>r.id===id);if(!r||r.status!=='Rascunho')return;draftId=id;modal('Solicitação #'+id.slice(0,8).toUpperCase(),`<div class="formgrid">${field('owner','Responsável',r.owner,'text',true,true)}${area('general','Justificativa geral (opcional)',r.general)}</div><div class="actions" style="margin:18px 0"><button type="button" onclick="if(saveDraftFields())itemForm('include')">+ Inclusão</button><button type="button" onclick="if(saveDraftFields())itemForm('exclude')">− Exclusão</button><button type="button" onclick="if(saveDraftFields())itemForm('value')">↗ Alterar valor</button></div><div>${r.items.map(i=>{const c=i.data||db.contracts.find(c=>c.id===i.contract);return `<div class="request"><div>${badge(typeName(i.type))}<strong style="display:block;margin-top:8px">${esc(c?.number)} · ${esc(c?.name)}</strong><p>${money(i.before)} → ${money(i.after)} · impacto ${money(i.after-i.before)}</p><p>${esc(i.justification)||'Justificativa pendente'}</p></div><div class="actions"><button type="button" onclick="if(saveDraftFields())itemForm('${i.type}','${i.id}')">Editar</button><button type="button" class="danger" onclick="removeItem('${i.id}')">Remover</button></div></div>`}).join('')||'<div class="empty">Adicione as alterações que compõem esta solicitação.</div>'}</div><div class="actions" style="margin-top:18px"><button type="button" onclick="if(saveDraftFields())showReport('${id}')">Pré-visualizar relatório</button><button type="button" class="primary" onclick="if(saveDraftFields())finalizeDialog('${id}')">Finalizar e aplicar alterações</button></div>`,v=>{if(!v.owner.trim())throw Error('Informe o responsável.');if(commit(()=>Object.assign(r,{owner:v.owner.trim(),general:v.general}))){closeModal();toast('Rascunho salvo.')}},'Salvar rascunho')}
function saveDraftFields(){const r=db.requests.find(r=>r.id===draftId);const owner=$('#f_owner')?.value||r.owner,general=$('#f_general')?.value??r.general;if(!owner.trim()){toast('Informe o responsável.',true);return false}return commit(()=>Object.assign(r,{owner:owner.trim(),general}))}
function removeItem(id){const r=db.requests.find(r=>r.id===draftId);if(saveDraftFields()&&commit(()=>r.items=r.items.filter(i=>i.id!==id)))editRequest(r.id)}
function itemForm(type,itemId){const r=db.requests.find(r=>r.id===draftId),item=r.items.find(i=>i.id===itemId);let body='';if(type==='include'){body=contractFields(item?.data)+field('date','Data da alteração',item?.date||today(),'date',true)}else{const opts=contracts().filter(c=>active(c)&&(!r.items.some(i=>i.contract===c.id&&i.id!==itemId)));body=`<div class="formgrid"><div class="field full"><label>Contratação *</label><select id="f_contract" name="contract" required><option value="">Selecione uma contratação</option>${opts.map(c=>`<option value="${c.id}" ${item?.contract===c.id?'selected':''}>${esc(c.number+' · '+c.name)}</option>`).join('')}</select></div><div id="oldValue" class="full hint"></div>${type==='value'?field('after','Novo valor estimado (R$)',item?.after??'','number',true)+field('annual','Valores por exercício',item?.annual||'') :''}${field('date','Data da alteração',item?.date||today(),'date',true)}${area('justification','Justificativa da alteração',item?.justification||'',true)}<div id="delta" class="hint full"></div></div>`}modal(typeName(type),body,v=>{let obj;if(!v.date)throw Error('Informe a data.');if(!v.justification.trim())throw Error('Informe uma justificativa.');if(type==='include'){const data=readContract(v,item?.data);if(r.items.some(i=>i.id!==itemId&&i.type==='include'&&i.data.number.toLowerCase()===data.number.toLowerCase()))throw Error('Número repetido nesta solicitação.');obj={data:{...data,id:item?.data.id||uid(),original:0,added:true,created:now(),updated:now(),demo:!!r.demo},before:0,after:data.current}}else{const c=db.contracts.find(c=>c.id===v.contract);if(!c||!active(c)||c.pca!==r.pca)throw Error('Selecione uma contratação ativa deste PCA.');const value=type==='exclude'?0:Number(v.after);if(!Number.isFinite(value)||value<0||type==='value'&&!v.after.trim())throw Error('Valor inválido.');obj={contract:c.id,before:c.current,after:round(value),annual:v.annual||''}}if(commit(()=>{const record={id:itemId||uid(),type,...obj,date:v.date,justification:v.justification.trim()};item?Object.assign(item,record):r.items.push(record)})){closeModal();editRequest(r.id)}},'Salvar alteração');if(type!=='include'){const update=()=>{const c=db.contracts.find(c=>c.id===$('#f_contract').value);$('#oldValue').textContent=c?`Valor atual: ${money(c.current)} · PCA ${pca().year} · ${c.unit}`:'';if(type==='value'&&c){const v=Number($('#f_after').value),diff=round(v-c.current);$('#delta').textContent=`${diff>=0?'Aumento':'Redução'}: ${money(diff)} · Variação: ${c.current?(diff/c.current*100).toFixed(2)+'%':'Não aplicável (valor anterior zero)'}`}};$('#f_contract').onchange=()=>{const c=db.contracts.find(c=>c.id===$('#f_contract').value);if(type==='value'&&c){$('#f_annual').value=c.annual;$('#f_after').value=c.current}update()};if(type==='value')$('#f_after').oninput=update;update()}}
function validateRequest(r){if(r.status!=='Rascunho')throw Error('Somente rascunhos podem ser finalizados.');if(!r.owner.trim()||!r.items.length)throw Error('Informe responsável e ao menos uma alteração.');const seen=new Set(),numbers=new Set(db.contracts.filter(c=>c.pca===r.pca).map(c=>c.number.toLowerCase()));for(const i of r.items){if(!i.justification.trim()||!i.date)throw Error('Todas as alterações precisam de justificativa e data.');if(i.type==='include'){if(numbers.has(i.data.number.toLowerCase()))throw Error('Número de contratação duplicado: '+i.data.number);numbers.add(i.data.number.toLowerCase())}else{const c=db.contracts.find(c=>c.id===i.contract);if(!c||!active(c)||c.pca!==r.pca)throw Error('Uma contratação está indisponível ou foi excluída.');if(seen.has(c.id))throw Error('Uma contratação possui operações duplicadas.');seen.add(c.id);if(c.current!==i.before)throw Error('Um valor foi alterado desde a criação do rascunho. Edite a alteração para atualizar sua base.');if(i.type==='value'&&i.after===i.before&&i.annual===c.annual)throw Error('Informe uma alteração de valor ou de distribuição por exercício.')}if(!Number.isFinite(i.after)||i.after<0)throw Error('Valor de alteração inválido.')}}
function finalizeDialog(id){const r=db.requests.find(r=>r.id===id);try{validateRequest(r)}catch(e){return toast(e.message,true)}modal('Finalizar solicitação',`<p>Serão aplicadas <strong>${r.items.length} alterações</strong> ao PCA ${pca().year}.</p><p>Impacto financeiro: <strong>${money(sum(r.items.map(i=>i.after-i.before)))}</strong>.</p><p class="hint">Os valores anteriores e as justificativas serão preservados no histórico. A operação finalizada não será aplicada novamente.</p>`,()=>{if(commit(()=>applyRequest(r))){closeModal();toast('Solicitação finalizada e alterações aplicadas.');showReport(id)}},'Confirmar finalização')}
function applyRequest(r){validateRequest(r);r.totalBefore=total(db.contracts.filter(c=>c.pca===r.pca));for(const i of r.items){let c;if(i.type==='include'){c={...i.data,pca:r.pca,current:i.after,original:0,added:true,created:now(),updated:now(),demo:!!r.demo};db.contracts.push(c);i.contract=c.id}else{c=db.contracts.find(c=>c.id===i.contract);if(i.type==='exclude')c.status='Excluída do PCA';else{c.current=i.after;c.annual=i.annual??c.annual}c.updated=now()}i.snapshot=JSON.parse(JSON.stringify(c));db.history.push({id:uid(),pca:r.pca,contract:c.id,type:i.type,at:now(),date:i.date,operator:r.owner,before:i.before,after:i.after,justification:i.justification,request:r.id,demo:!!r.demo})}r.totalAfter=total(db.contracts.filter(c=>c.pca===r.pca));r.status='Finalizada';r.finalized=now();r.pcaSnapshot=JSON.parse(JSON.stringify(db.pcas.find(p=>p.id===r.pca)))}
function cancelRequest(id){modal('Cancelar solicitação','<p>O rascunho será preservado com a situação Cancelada. Nenhuma alteração será aplicada.</p>',()=>{if(commit(()=>db.requests.find(r=>r.id===id).status='Cancelada')){closeModal();toast('Solicitação cancelada.')}},'Confirmar cancelamento')}
function showReport(id){reportId=id;closeModal();page='reports';render()}function reportData(r){const p=r.pcaSnapshot||db.pcas.find(p=>p.id===r.pca),before=r.totalBefore??total(db.contracts.filter(c=>c.pca===r.pca)),impact=round(sum(r.items.map(i=>i.after-i.before)));return{p,before,impact,after:r.totalAfter??round(before+impact)}}
function reportText(r){const {p,before,after,impact}=reportData(r);return `MINUTA PARA CONFERÊNCIA — NÃO APROVADA\nRelatório de alteração do Plano de Contratações Anual — PCA ${p.year}\nUnidade: ${p.unit}\nResponsável: ${r.owner}\nSolicitação: ${r.id}\nElaboração: ${dt(r.created)}\nSituação: ${r.status}\n\nTrata-se de proposta de alteração do Plano de Contratações Anual referente ao exercício de ${p.year}, contemplando as alterações detalhadas a seguir, para conferência e validação da unidade responsável.\n\n${r.general?'Justificativa geral: '+r.general+'\n\n':''}${r.items.map(i=>{const c=i.snapshot||i.data||db.contracts.find(c=>c.id===i.contract);return `${typeName(i.type).toUpperCase()} — ${c.number}\nNome da futura contratação: ${c.name}\nObjeto: ${c.description}\nUnidade demandante: ${c.unit}\nValor anterior: ${money(i.before)}\nNovo valor: ${money(i.after)}${i.type==='exclude'?' (retirado da composição do PCA)':''}\nImpacto: ${money(i.after-i.before)}\nVariação: ${i.before?((i.after-i.before)/i.before*100).toFixed(2)+'%':'Não aplicável'}\nValores por exercício: ${i.annual||c.annual||'Não informado'}\nVigência inicial: ${dt(c.start)}\nData desejada: ${dt(c.desired)}\nPrioridade: ${c.priority}\nData da alteração: ${dt(i.date)}\nJustificativa: ${i.justification}`}).join('\n\n')}\n\nRESUMO FINANCEIRO\n${['include','exclude','value'].map(t=>`${typeName(t)}: ${r.items.filter(i=>i.type===t).length} — ${money(sum(r.items.filter(i=>i.type===t).map(i=>i.after-i.before)))}`).join('\n')}\nValor total antes: ${money(before)}\nImpacto total: ${money(impact)}\nValor total após: ${money(after)}\n\nDocumento de apoio. Minuta sujeita à conferência e validação da unidade responsável.${r.status==='Rascunho'?' Valores projetados; alterações ainda não aplicadas.':''}`}
function reportHTML(r){const {p,before,after,impact}=reportData(r);return `<article class="report"><div class="eyebrow">Advocacia-Geral da União · ${esc(p.unit)}</div><h1>Relatório de alteração do PCA ${p.year}</h1>${badge('Minuta para conferência — não aprovada')} ${badge(r.status)}<p><strong>Solicitação:</strong> ${esc(r.id)}<br><strong>Elaboração:</strong> ${dt(r.created)}<br><strong>Responsável:</strong> ${esc(r.owner)}</p>${r.demo?'<p><strong>DADOS DEMONSTRATIVOS — EXEMPLO FICTÍCIO</strong></p>':''}${r.status!=='Finalizada'?'<p><strong>Projeção: as alterações deste documento não foram aplicadas.</strong></p>':''}<h2>1. Identificação e finalidade</h2><p>Trata-se de proposta de alteração do Plano de Contratações Anual referente ao exercício de ${p.year}, contemplando as alterações detalhadas neste relatório, para conferência e validação da unidade responsável.</p>${r.general?`<p><strong>Justificativa geral:</strong> ${esc(r.general)}</p>`:''}<h2>2. Resumo das alterações</h2><div class="tablewrap"><table><thead><tr><th>Tipo de alteração</th><th>Quantidade</th><th>Impacto financeiro</th></tr></thead><tbody>${['include','exclude','value'].map(t=>`<tr><td>${typeName(t)}</td><td>${r.items.filter(i=>i.type===t).length}</td><td>${money(sum(r.items.filter(i=>i.type===t).map(i=>i.after-i.before)))}</td></tr>`).join('')}<tr><td><strong>Total</strong></td><td>${r.items.length}</td><td><strong>${money(impact)}</strong></td></tr></tbody></table></div><h2>3. Detalhamento e justificativas</h2>${r.items.map((i,n)=>{const c=i.snapshot||i.data||db.contracts.find(c=>c.id===i.contract);return `<section class="report-item"><h3>${n+1}. ${esc(c.number)} — ${esc(c.name)}</h3><p><strong>Tipo:</strong> ${typeName(i.type)}<br><strong>Objeto:</strong> ${esc(c.description)}<br><strong>Unidade:</strong> ${esc(c.unit)}<br><strong>Valor anterior:</strong> ${money(i.before)}<br><strong>Novo valor:</strong> ${money(i.after)}${i.type==='exclude'?' (retirado da composição do PCA)':''}<br><strong>Impacto:</strong> ${money(i.after-i.before)} · ${i.before?((i.after-i.before)/i.before*100).toFixed(2)+'%':'Variação percentual não aplicável'}<br><strong>Valores por exercício:</strong> ${esc(i.annual||c.annual||'Não informado')}<br><strong>Vigência inicial:</strong> ${dt(c.start)} · <strong>Data desejada:</strong> ${dt(c.desired)}<br><strong>Prioridade:</strong> ${esc(c.priority)} · <strong>Data da alteração:</strong> ${dt(i.date)}</p><p><strong>Justificativa:</strong> ${esc(i.justification)}</p></section>`}).join('')}<h2>4. Consolidação financeira</h2><p>Valor total do PCA antes das alterações: <strong>${money(before)}</strong><br>Impacto financeiro total: <strong>${money(impact)}</strong><br>Valor total do PCA após as alterações: <strong>${money(after)}</strong></p><h2>5. Encaminhamento</h2><p>Submete-se esta minuta à conferência e validação da unidade responsável. As justificativas foram reproduzidas conforme informadas, sem acréscimo de fundamentos normativos.</p></article>`}
function reports(){const rs=requests().filter(r=>r.status!=='Cancelada');if(!rs.some(r=>r.id===reportId))reportId=rs.at(-1)?.id||'';const r=rs.find(r=>r.id===reportId);return heading('Relatórios e notas técnicas','Documentos gerados a partir das solicitações, com valores e justificativas.',r?`<button onclick="copyReport()">Copiar minuta</button><button onclick="exportReport()">Exportar CSV</button><button onclick="downloadReport()">Baixar HTML</button><button class="primary" onclick="window.print()">Imprimir / salvar PDF</button>`:'')+`<section class="panel noprint"><label>Solicitação de alteração do PCA</label><select onchange="reportId=this.value;render()">${rs.map(r=>`<option value="${r.id}" ${r.id===reportId?'selected':''}>#${r.id.slice(0,8).toUpperCase()} · ${r.status} · ${dt(r.created)} · ${r.items.length} alterações</option>`).join('')}</select><p class="hint">Selecione uma solicitação para gerar o relatório. Rascunhos exibem projeções; finalizadas preservam os dados da efetivação.</p></section>${r?reportHTML(r):'<div class="panel empty">Crie uma solicitação em Alterações do PCA para gerar o relatório.</div>'}`}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function csvCell(v){let t=String(v??'');if(/^[\s]*[=+\-@]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'}function csv(rows){return '\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')}
function exportContracts(){download(`contratacoes-pca-${pca()?.year||'dados'}.csv`,csv([['Número','Nome','Objeto','Unidade','Valor original','Valor atualizado','Valores por exercício','Vigência','Data desejada','Prioridade','Situação','Justificativa'],...contracts().map(c=>[c.number,c.name,c.description,c.unit,c.original.toFixed(2).replace('.',','),c.current.toFixed(2).replace('.',','),c.annual,c.start,c.desired,c.priority,c.status,c.justification])]),'text/csv;charset=utf-8')}
function exportReport(){const r=db.requests.find(r=>r.id===reportId),d=reportData(r);download('relatorio-pca-'+d.p.year+'.csv',csv([['Solicitação','PCA','Responsável','Tipo','Número','Nome','Anterior','Novo','Impacto','Valores por exercício','Vigência','Data desejada','Prioridade','Data alteração','Justificativa'],...r.items.map(i=>{const c=i.snapshot||i.data||db.contracts.find(c=>c.id===i.contract);return[r.id,d.p.year,r.owner,typeName(i.type),c.number,c.name,i.before.toFixed(2).replace('.',','),i.after.toFixed(2).replace('.',','),(i.after-i.before).toFixed(2).replace('.',','),i.annual||c.annual,c.start,c.desired,c.priority,i.date,i.justification]}),['TOTAL ANTES',d.before],['TOTAL DEPOIS',d.after],['IMPACTO TOTAL',d.impact]]),'text/csv;charset=utf-8')}
async function copyReport(){const text=reportText(db.requests.find(r=>r.id===reportId));try{await navigator.clipboard.writeText(text);toast('Minuta copiada.')}catch(e){modal('Copiar minuta',`<p class="hint">Selecione e copie o texto abaixo.</p><textarea style="height:380px" id="copyText" readonly>${esc(text)}</textarea>`,null);$('#copyText').select()}}
function downloadReport(){const r=db.requests.find(r=>r.id===reportId);download('relatorio-pca-'+reportData(r).p.year+'.html','<!DOCTYPE html><html lang="pt-BR"><meta charset="utf-8"><title>Relatório do PCA</title><style>'+document.querySelector('style').textContent+'body{background:white;padding:30px;max-width:1000px;margin:auto}.report{border:0}</style>'+reportHTML(r)+'</html>','text/html;charset=utf-8')}
const importFields=[['number','Número *'],['name','Nome da contratação *'],['description','Objeto / descrição'],['unit','Unidade demandante'],['current','Valor estimado *'],['original','Valor original'],['year','Exercício do PCA'],['annual','Valores por exercício'],['start','Vigência inicial'],['desired','Data desejada'],['priority','Prioridade'],['status','Situação'],['justification','Justificativa']];
function io(){return heading('Importação e exportação','Traga os dados da planilha e mantenha cópias de segurança.')+`<section class="panel"><h2>Importar planilha de monitoramento</h2><p class="hint">Importe diretamente um arquivo <strong>Excel (.xlsx)</strong>, os cabeçalhos e as colunas são identificados automaticamente em toda a aba. CSV também é aceito. Para arquivos antigos .xls ou protegidos por senha, salve uma cópia .xlsx sem senha antes de importar.</p><div class="steps"><span class="step">1. Escolher arquivo</span><span class="step">2. Mapear e validar</span><span class="step">3. Confirmar importação</span></div><div class="filebox"><h3>Selecione a planilha Excel de monitoramento</h3><p class="hint">A importação acrescenta previsões originais. Inclusões posteriores devem passar por uma solicitação.</p><input type="file" accept=".xlsx,.xlsm,.csv,.tsv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" aria-label="Selecionar Excel ou CSV" onchange="loadSpreadsheet(this.files[0]);this.value=''"><div id="importStatus" role="status" aria-live="polite" class="hint"></div><p><button onclick="downloadTemplate()">Baixar modelo CSV</button></p></div></section><div class="grid2"><section class="panel"><h2>Exportar dados</h2><p class="hint">Baixe as contratações do PCA ativo ou um backup completo com os PCAs, solicitações e histórico.</p><div class="actions"><button onclick="exportContracts()">Contratações em CSV</button><button class="primary" onclick="backup()">Backup completo JSON</button></div></section><section class="panel"><h2>Restaurar backup</h2><p class="hint">A restauração substitui todos os dados locais após validação e confirmação. Exporte um backup antes.</p><input type="file" accept=".json,application/json" aria-label="Restaurar JSON" onchange="loadBackup(this.files[0])"></section></div><section class="notice"><span><strong>Seus dados ficam apenas neste navegador.</strong> Não há sincronização entre usuários. A limpeza do navegador pode apagar registros. Faça backups regulares.</span></section>`}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let quote=false,line='';for(let i=0;i<text.length;i++){if(text[i]==='"')quote=!quote;if(!quote&&/[\r\n]/.test(text[i]))break;line+=text[i]}const delimiters=[';',',','\t'];const counts=delimiters.map(d=>{let q=false,n=0;for(const c of line){if(c==='"')q=!q;if(!q&&c===d)n++}return n});const delim=delimiters[counts.indexOf(Math.max(...counts))];const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===delim&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV com aspas não fechadas.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function parseMoney(v){let s=String(v??'').trim().replace(/R\$|\s/g,'');if(!s)return NaN;if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');if(!/^\d+(\.\d{1,2})?$/.test(s))return NaN;return round(Number(s))}
function parseDate(s){s=String(s||'').trim();if(!s)return '';if(/^\d{2}\/\d{2}\/\d{4}$/.test(s))s=s.split('/').reverse().join('-');if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||!Number.isFinite(Date.parse(s+'T12:00:00Z'))||new Date(s+'T12:00:00Z').toISOString().slice(0,10)!==s)throw Error('Data inválida: '+s);return s}
async function loadCSV(file){if(!file)return;if(!pca())return toast('Cadastre um PCA primeiro.',true);if(file.size>15*1024*1024)return toast('Limite de importação: 15 MB.',true);try{const rows=parseCSV(await file.text());if(rows.length<2)throw Error('O arquivo precisa conter cabeçalhos e registros.');if(rows.length>50001)throw Error('Limite: 50.000 registros por arquivo.');importHeaders=rows.shift();importRows=rows;mapImport()}catch(e){toast(e.message,true)}}
function mapImport(mapping={}){const aliases=columnAliases;const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();modal('Relacionar colunas da planilha',`<p class="hint">${importRows.length} linhas encontradas. Selecione as colunas correspondentes aos campos do sistema.</p><div class="formgrid"><div class="field full"><label>PCA de destino</label><select name="target"><option value="" ${!db.active?'selected':''}>Criar PCAs automaticamente pelos anos da planilha</option>${db.pcas.map(p=>`<option value="${p.id}" ${db.active===p.id?'selected':''}>PCA ${p.year} · ${esc(p.unit)}</option>`).join('')}</select></div>${importFields.map(([k,l])=>{const ix=mapping[k]??importHeaders.findIndex(h=>(aliases[k]||[]).includes(norm(h)));return `<div class="field"><label>${l}</label><select name="${k}" ${['number','name','current'].includes(k)?'required':''}><option value="">Não mapear</option>${importHeaders.map((h,j)=>`<option value="${j}" ${String(ix)===String(j)?'selected':''}>${esc(h)||'Coluna '+(j+1)}</option>`).join('')}</select></div>`}).join('')}</div>`,v=>previewImport(v),'Validar e visualizar')}

  await new Promise(resolve=>setTimeout(resolve,40));

   const status=({planejada:'Planejada','a iniciar':'Planejada','em andamento':'Em andamento',atrasado:'Em andamento',concluido:'Concluída',concluida:'Concluída',suspensa:'Suspensa',excluido:'Excluída do PCA',excluida:'Excluída do PCA','excluida do pca':'Excluída do PCA',migrado:'Suspensa','nao executado':'Suspensa',frustrado:'Suspensa',replanejado:'Planejada'})[sk]||'Planejada';
   const sourceFields=importHeaders.map((header,i)=>({column:i+1,header:header||'Coluna '+(i+1),value:row[i]??''}));
   const safeDate=k=>{const v=get(k);if(!v)return '';try{return parseDate(v)}catch{warnings.push('Data de '+k+' preservada apenas nos campos originais: '+v);return ''}};
   c={id:uid(),pca:p.id,number,name,description:get('description')||name,unit:get('unit')||p.unit,current:value,original,annual:get('annual'),start:safeDate('start'),desired:safeDate('desired'),priority,status,justification:get('justification')||'Registro importado da planilha de monitoramento.',created:now(),updated:now(),added:false,demo:false,sourceStatus,sourcePriority:priorityText,sourceFields,sourceSheet:importSheetName,sourceRow:row._sourceRow||importSourceRows[index]||index+2,importWarnings:warnings};keys.add(key);
  }catch(e){error=e.message}
  return{line:row._sourceRow||importSourceRows[index]||index+2,c,error,number,name,warnings};
 });
 const valid=importCandidates.filter(x=>!x.error),years=[...new Set(valid.map(x=>(db.pcas.find(p=>p.id===x.c.pca)||pendingPcas.find(p=>p.id===x.c.pca)).year))].sort();
 modal('Prévia e confirmação da importação',`<p><strong>${valid.length} contratações prontas para importar</strong> · exercícios ${years.join(', ')||'—'}.</p><div class="notice">${importRows.length} linhas analisadas em toda a aba. ${importCandidates.length-valid.length} linhas não serão importadas; confira a validação completa. Nenhum registro existente será apagado.</div><p class="hint">${pendingPcas.filter(p=>valid.some(x=>x.c.pca===p.id)).length} PCAs serão criados ao confirmar. As situações e prioridades originais e todas as colunas da planilha serão preservadas nos detalhes. “Migrado”, “Não executado” e “Frustrado” ficam como Suspensa; “Excluído” fica fora do total ativo.</p><div class="tablewrap"><table><thead><tr><th>Linha</th><th>PCA</th><th>Contratação</th><th>Objeto</th><th>Valor atualizado</th><th>Situação original</th><th>Resultado</th></tr></thead><tbody>${importCandidates.slice(0,150).map(x=>`<tr><td>${x.line}</td><td>${x.error?'—':(db.pcas.find(p=>p.id===x.c.pca)||pendingPcas.find(p=>p.id===x.c.pca)).year}</td><td>${esc(x.number)}</td><td>${esc(x.name)}</td><td>${x.error?'—':money(x.c.current)}</td><td>${esc(x.c.sourceStatus)}</td><td>${esc(x.error)||'Válido'}${x.warnings.length?'<small>'+esc(x.warnings.join(' '))+'</small>':''}</td></tr>`).join('')}</tbody></table></div><div class="actions" style="margin-top:15px"><button type="button" onclick="downloadValidation()">Baixar validação completa</button></div><p class="hint">A prévia exibe até 150 linhas. A importação inclui todas as linhas válidas, independentemente desse limite visual.</p>`,()=>{
  if(!valid.length)throw Error('Nenhum registro válido para importar.');
  const existing=new Set(db.contracts.map(c=>c.pca+'|'+c.number.toLowerCase()));if(valid.some(x=>existing.has(x.c.pca+'|'+x.c.number.toLowerCase())))throw Error('Os registros mudaram. Refaça a validação.');
  if(commit(()=>{pendingPcas.filter(p=>valid.some(x=>x.c.pca===p.id)).forEach(p=>db.pcas.push(p));valid.forEach(x=>db.contracts.push(x.c));db.active=valid.at(-1).c.pca})){closeModal();toast(`${valid.length} contratações importadas em ${years.length} exercícios; ${importCandidates.length-valid.length} linhas ignoradas.`);go('monitor')}
 },'Confirmar importação de '+valid.length+' contratações');
}

render();
